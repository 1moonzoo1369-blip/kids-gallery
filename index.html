<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 아이 그림앨범</title>
<meta name="theme-color" content="#f6eadb">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <img src="assets/logo.png" alt="">
    <span id="brandTitle">우리 아이 그림앨범</span>
  </a>
  <nav class="top-actions">
    <a class="pill-btn ghost" id="homeBtn" href="#/" hidden>
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>갤러리 선택</span>
    </a>
    <button class="pill-btn primary" id="uploadBtn" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>그림 올리기</span>
    </button>
    <button class="icon-btn" id="settingsBtn" title="설정 (아이 사진·이름)" aria-label="설정" hidden>
      <svg viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon-btn" id="lockBtn" title="업로드 잠금 해제">
      <svg viewBox="0 0 24 24" id="lockIcon"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<div class="toast" id="toast" role="status"></div>

<!-- 모달 공용 -->
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script src="js/config.js"></script>
<script src="js/github.js"></script>
<script src="js/app.js"></script>
</body>
</html>
