<script>
  // 카카오톡 안에서 열리면 → 휴대폰 기본 브라우저(크롬/사파리)로 다시 열기
  (function () {
    var ua = navigator.userAgent || '';
    if (!/KAKAOTALK/i.test(ua)) return;
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    setTimeout(function () { // 바깥 브라우저가 열린 뒤 카톡 안의 창은 닫기
      location.href = /iPhone|iPad|iPod/i.test(ua) ? 'kakaoweb://closeBrowser' : 'kakaotalk://inappbrowser/close';
    }, 1500);
  })();
</script>
